#@TYPE: Machine
#@NAME: Qualcomm IQ10-RRD based on Nord with open boot firmware support
#@DESCRIPTION: Machine configuration for Qualcomm IQ10-RRD, with Nord

require conf/machine/nord-rrd.conf

EXTRA_IMAGEDEPENDS += "trusted-firmware-a-qcom-nord"

MACHINE_FEATURES += "optee"
MACHINE_EXTRA_RRECOMMENDS += "${@bb.utils.contains('BBFILE_COLLECTIONS', 'meta-arm', 'packagegroup-optee', '', d)}"

PREFERRED_PROVIDER_virtual/bootloader = "u-boot-qcom"

QCOM_TFA_FIP_FLASH = "0"
QCOM_TFA_RECIPE = "trusted-firmware-a-qcom-nord"

# Build U-Boot with an SPL and enable the flow that packs BL31 and OP-TEE into
# the FIT the SPL loads.
UBOOT_CONFIG = "nord-spl"
QCOM_SPL_FW_TYPE = "tz"
require conf/machine/include/qcom-uboot-spl-fit.inc
