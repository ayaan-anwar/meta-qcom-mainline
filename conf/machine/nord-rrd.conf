#@TYPE: Machine
#@NAME: Qualcomm Dragonwing IQ10 RRD (Robotics Reference Design)
#@DESCRIPTION: Machine configuration for Qualcomm IQ10 RRD, built on Nord SoC.

require conf/machine/include/qcom-nord.inc

MACHINE_FEATURES += "efi pci"

KERNEL_DEVICETREE ?= " \
    qcom/nord-ride-embedded.dtb \
    qcom/nord-rrd.dtb \
    "

# These DTs are not upstreamed and currently exist only in linux-qcom-next kernel
KERNEL_DEVICETREE:append:pn-linux-qcom-next = " \
                      qcom/nord-ride-embedded-camx.dtbo \
                      qcom/nord-rrd-camx.dtbo \
                      "

# Temporary change to reduce dmesg loglevel to avoid login failures
KERNEL_CMDLINE_EXTRA:append = " loglevel=3 adbd.udc=a600000.usb"

MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += " \
    packagegroup-nord-rrd-firmware \
"

QCOM_CDT_FILE = "cdt_ridesx"
QCOM_BOOT_FILES_SUBDIR = "nord"
QCOM_PARTITION_FILES_SUBDIR ?= "partitions/nord-rrd/ufs"

QCOM_BOOT_FIRMWARE = "firmware-qcom-boot-nord"
QCOM_CDT_FIRMWARE = "firmware-qcom-cdt-nord"

UBOOT_CONFIG = "nord"
